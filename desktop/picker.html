<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Layar Bersama: Pilih yang akan di-cast</title>
<style>
  :root { --bg: #f4f4f1; --panel: #fff; --text: #1c1c1a; --muted: #6b6b66; --line: #dcdcd6; --accent: #1f6f5c; --accent-text: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1f1f1d; --text: #ecece8; --muted: #9b9b94; --line: #34342f; --accent: #3fa58a; --accent-text: #08130f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh; }
  header { padding: 16px 16px 8px; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  p { margin: 0; color: var(--muted); font-size: 13px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 16px 8px; }
  main { flex: 1; overflow: auto; padding-bottom: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; padding: 0 16px; }
  button.src { all: unset; box-sizing: border-box; cursor: pointer; border: 2px solid var(--line); border-radius: 8px;
    background: var(--panel); overflow: hidden; display: flex; flex-direction: column; }
  button.src:hover { border-color: var(--muted); }
  button.src:focus-visible, button.src.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .src img { width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; display: block; }
  .src span { padding: 6px 8px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  footer { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); }
  footer button { font: inherit; padding: 9px 16px; min-height: 40px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); cursor: pointer; }
  footer .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  footer button:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Pilih yang akan ditampilkan di TV</h1>
  <p>Seluruh layar ikut mengirim suara komputer. Satu jendela hanya mengirim gambar.</p>
</header>
<main>
  <h2>Layar</h2><div class="grid" id="screens"></div>
  <h2>Jendela</h2><div class="grid" id="windows"></div>
</main>
<footer>
  <button id="cancel">Batal</button>
  <button id="ok" class="primary" disabled>Mulai cast</button>
</footer>
<script>
  let selected = null;
  const ok = document.getElementById('ok');
  const choose = (id) => window.layarDesktop.pickerChoose(id);
  window.layarDesktop.pickerSources().then((sources) => {
    sources.forEach((s, i) => {
      const b = document.createElement('button');
      b.className = 'src';
      b.title = s.name;
      const img = document.createElement('img'); img.src = s.thumb; img.alt = '';
      const label = document.createElement('span');
      label.textContent = s.screen ? (sources.filter((x) => x.screen).length > 1 ? s.name : 'Seluruh layar') : s.name;
      b.append(img, label);
      b.onclick = () => {
        document.querySelectorAll('.src.sel').forEach((x) => x.classList.remove('sel'));
        b.classList.add('sel'); selected = s.id; ok.disabled = false;
      };
      b.ondblclick = () => choose(s.id);
      document.getElementById(s.screen ? 'screens' : 'windows').append(b);
      if (i === 0) { b.click(); b.focus(); }
    });
  });
  ok.onclick = () => selected && choose(selected);
  document.getElementById('cancel').onclick = () => choose(null);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') choose(null);
    if (e.key === 'Enter' && selected) choose(selected);
  });
</script>
</body>
</html>

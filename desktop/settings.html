<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Layar Bersama: Pengaturan</title>
<style>
  :root { --bg: #f4f4f1; --panel: #fff; --text: #1c1c1a; --muted: #6b6b66; --line: #dcdcd6;
    --accent: #1f6f5c; --accent-text: #fff; --danger: #a3302a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1f1f1d; --text: #ecece8; --muted: #9b9b94; --line: #34342f;
      --accent: #3fa58a; --accent-text: #08130f; --danger: #e0645c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, "Segoe UI", sans-serif; padding: 16px; }
  form { width: min(520px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 18px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--bg); color: var(--text); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .examples { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  .error { color: var(--danger); min-height: 1.4em; margin: 12px 0 0; }
  .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  button { font: inherit; padding: 9px 16px; min-height: 42px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<form id="f">
  <h1>Alamat server Layar Bersama</h1>
  <p>App ini membuka halaman kontrol dari server kamu.</p>
  <label for="server">Alamat server</label>
  <input id="server" type="text" placeholder="https://layar.contoh.com" autocomplete="off" spellcheck="false">
  <p class="examples">Contoh: <code>https://layar.contoh.com</code> atau alamat lokal <code>192.168.1.10:3080</code></p>
  <p class="error" id="err" role="alert"></p>
  <div class="row">
    <button type="button" id="cancel">Batal</button>
    <button class="primary">Simpan &amp; buka</button>
  </div>
</form>
<script>
  const q = new URLSearchParams(location.search);
  const input = document.getElementById('server');
  input.value = q.get('server') || '';
  document.getElementById('err').textContent = q.get('error') || '';
  document.getElementById('cancel').hidden = !q.get('server');
  input.focus();
  input.select();
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const res = await window.layarDesktop.saveServer(input.value);
    if (!res.ok) document.getElementById('err').textContent = res.error;
  });
  document.getElementById('cancel').onclick = () => window.layarDesktop.cancel();
</script>
</body>
</html>
